#ename{margin-top:60px;font:400 130px/1 var(--hf);text-transform:uppercase;text-align:center;padding:0 40px}
#eurl{margin-top:60px;font:800 60px Manrope;background:var(--ac);color:var(--btx);padding:26px 54px;border-radius:999px;box-shadow:0 30px 80px color-mix(in srgb,var(--ac) 45%,transparent)}
#esub{margin-top:40px;font:800 40px Manrope;letter-spacing:3px;text-transform:uppercase;color:var(--dim);text-align:center;padding:0 60px}
</style></head>

<script>
const D = window.DATA || { symbol:'TRENCHER', name:'Trencher', url:'trencher.sygil.pro', preview:true, logo:'', fam:{ style:'paper', ac:'#b3261e', head:"'Black Ops One',system-ui", fonts:'Black+Ops+One', emoji:'🎖️', crew:'soldiers', kick:'the trenches are calling', cta:'get your dog tags', tool:'enlistment office', lvTitle:'the front line', ranks:['private','corporal','sergeant','lieutenant','captain','general'], levels:['the foxhole','the hill','the bridge','the city','the capital','victory'] }, mc:148000, vol:62000, liq:31000, holders:4397, desc:'' };

const THEMES = { dark:{bg:'#0b0c10',bg2:'#171a23',card:'#151822',ink:'#f4f3f8',dim:'#9aa0b8',line:'rgba(255,255,255,.10)',btx:'#0b0c10',sbg:'#0b0c10'},
  neon:{bg:'#06070d',bg2:'#0f1222',card:'#0f1222',ink:'#f4f3f8',dim:'#9aa0b8',line:'rgba(124,108,255,.25)',btx:'#06070d',sbg:'#06070d'},
  light:{bg:'#fff4e8',bg2:'#ffe9d4',card:'#ffffff',ink:'#2a2118',dim:'#7d6e60',line:'rgba(40,30,20,.12)',btx:'#ffffff',sbg:'#fff8f0'},
  paper:{bg:'#e9dcbb',bg2:'#e0d0a8',card:'#f8eed6',ink:'#22201a',dim:'#6b6250',line:'rgba(34,32,26,.35)',btx:'#f8eed6',sbg:'#efe4c8'} };

// long names: shrink each big text until it fits on its line (never overflow the frame)
